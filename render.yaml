services:
  - type: web
    name: mpworks-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MPLADS_SOURCE_URL
        value: https://mplads.mospi.gov.in/digigov/dashboard.html
      - key: MPLADS_API_ORIGIN
        value: https://mplads.mospi.gov.in
      - key: MPLADS_MAX_STATES
        value: "0"
      - key: MPLADS_MAX_WORKS
        value: "0"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_CLOUD_PROJECT
        value: "200141425784"
      - key: R2_ACCOUNT_ID
        value: 3df99a00c707520696105ece185c3de8
      - key: R2_BUCKET
        value: mpworks
      - key: R2_ENDPOINT
        value: https://3df99a00c707520696105ece185c3de8.r2.cloudflarestorage.com
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_ORG_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: cron
    name: mpworks-ingest
    runtime: node
    # Render cron jobs require a paid plan in this workspace.
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    schedule: "0 2 * * *"
    buildCommand: npm install
    startCommand: npm run ingest
    envVars:
      - key: NODE_ENV
        value: production
      - key: MPLADS_SOURCE_URL
        value: https://mplads.mospi.gov.in/digigov/dashboard.html
      - key: MPLADS_API_ORIGIN
        value: https://mplads.mospi.gov.in
      - key: MPLADS_MAX_STATES
        value: "0"
      - key: MPLADS_MAX_WORKS
        value: "0"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_CLOUD_PROJECT
        value: "200141425784"
      - key: R2_ACCOUNT_ID
        value: 3df99a00c707520696105ece185c3de8
      - key: R2_BUCKET
        value: mpworks
      - key: R2_ENDPOINT
        value: https://3df99a00c707520696105ece185c3de8.r2.cloudflarestorage.com
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_ORG_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
